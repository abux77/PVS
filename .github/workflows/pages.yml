name: Deploy PVS companion

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'docs/pvs-user-guide/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Build Pages artifact with app and guide
        run: |
          mkdir -p _site/pvs-user-guide
          cp -a web/. _site/
          cp -a docs/pvs-user-guide/. _site/pvs-user-guide/
      - name: Upload companion webpage and documentation
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
